services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openclass
      POSTGRES_PASSWORD: openclass
      POSTGRES_DB: openclass
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - openclass_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclass -d openclass"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://openclass:openclass@db:5432/openclass
      OLLAMA_URL: http://host.docker.internal:11434
      DEFAULT_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT_SECONDS: 600
      MAX_UPLOAD_MB: 15
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  openclass_postgres:
